name: Build Windows Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\AARTool"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # ---------------------------------------------------------------
          # 1. 依存パッケージをフォルダに直接インストール
          # ---------------------------------------------------------------
          $pkgs = "$dist\Lib\site-packages"
          New-Item -ItemType Directory -Path $pkgs -Force | Out-Null
          pip install mss pygetwindow ollama Pillow pyaudio SpeechRecognition `
            --target $pkgs --no-warn-script-location

          # ---------------------------------------------------------------
          # 2. Python embeddable をダウンロードして展開
          # ---------------------------------------------------------------
          $pyver = "3.11.9"
          $url   = "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip"
          Invoke-WebRequest $url -OutFile python_embed.zip
          Expand-Archive python_embed.zip -DestinationPath $dist -Force

          # ---------------------------------------------------------------
          # 3. ._pth に site-packages パスを追加してインポートできるようにする
          # ---------------------------------------------------------------
          $pth = Get-ChildItem $dist -Filter "python311._pth" | Select-Object -First 1
          $lines = Get-Content $pth.FullName
          $lines = $lines -replace '#import site', 'import site'
          $lines += "Lib\site-packages"
          Set-Content $pth.FullName ($lines -join "`n")

          # ---------------------------------------------------------------
          # 4. tkinter サポートファイルを Python インストール先からコピー
          # ---------------------------------------------------------------
          # embeddable Python には tkinter が含まれないため全ファイルを手動コピー
          $pyDir  = Split-Path (Get-Command python).Path
          $dlls   = "$pyDir\DLLs"
          # C拡張 と TCL/TK DLL
          foreach ($f in @("_tkinter.pyd","tcl86t.dll","tk86t.dll","zlib1.dll")) {
            if (Test-Path "$dlls\$f") { Copy-Item "$dlls\$f" $dist }
          }
          # TCL/TK ランタイムデータ
          if (Test-Path "$pyDir\tcl") {
            Copy-Item "$pyDir\tcl" "$dist\tcl" -Recurse -Force
          }
          # tkinter Python パッケージ本体（embeddable には含まれないため必須）
          if (Test-Path "$pyDir\Lib\tkinter") {
            Copy-Item "$pyDir\Lib\tkinter" "$pkgs\tkinter" -Recurse -Force
          }

          # ---------------------------------------------------------------
          # 5. OCR ヘルパー（.NET Framework 4.8 exe）をビルドして同梱
          # ---------------------------------------------------------------
          # PowerShell から WinRT async を呼ぶのは困難なため C# exe を使う。
          # .NET Framework 4.8 は Windows 10/11 に標準搭載なので追加インストール不要。
          dotnet publish ocr_helper\ocr_helper.csproj -c Release -o "$dist\_ocr_tmp"
          Copy-Item "$dist\_ocr_tmp\ocr_helper.exe" "$dist\"
          Remove-Item "$dist\_ocr_tmp" -Recurse -Force

          # ---------------------------------------------------------------
          # 6. アプリ本体をコピー
          # ---------------------------------------------------------------
          Copy-Item aar_tool.py $dist\

          # ---------------------------------------------------------------
          # 6. ランチャー作成
          # ---------------------------------------------------------------
          # TCL_LIBRARY / TK_LIBRARY を明示指定しないと embeddable Python では
          # tkinter が tcl/tk ライブラリを見つけられず無音クラッシュする。
          # pythonw.exe はコンソールなし起動。start /B で即座にバッチを終了。
          $bat = '@echo off' + "`r`n" +
                 'set TCL_LIBRARY=%~dp0tcl\tcl8.6' + "`r`n" +
                 'set TK_LIBRARY=%~dp0tcl\tk8.6' + "`r`n" +
                 'cd /d "%~dp0"' + "`r`n" +
                 'start /B "" "%~dp0pythonw.exe" "%~dp0aar_tool.py"'
          Set-Content "$dist\AARTool.bat" $bat -Encoding ASCII

          # debug.bat: コンソール付き python.exe で起動しエラーを画面に表示
          $dbg = '@echo off' + "`r`n" +
                 'set TCL_LIBRARY=%~dp0tcl\tcl8.6' + "`r`n" +
                 'set TK_LIBRARY=%~dp0tcl\tk8.6' + "`r`n" +
                 'cd /d "%~dp0"' + "`r`n" +
                 '"%~dp0python.exe" "%~dp0aar_tool.py"' + "`r`n" +
                 'pause'
          Set-Content "$dist\debug.bat" $dbg -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AARTool-Windows
          path: dist\AARTool\
          retention-days: 30
