name: Build Windows Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\PlayMemoMaker"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # ---------------------------------------------------------------
          # 1. 依存パッケージをフォルダに直接インストール
          # ---------------------------------------------------------------
          $pkgs = "$dist\Lib\site-packages"
          New-Item -ItemType Directory -Path $pkgs -Force | Out-Null
          pip install mss pygetwindow ollama Pillow sounddevice SpeechRecognition pynput numpy `
            --target $pkgs --no-warn-script-location

          # ---------------------------------------------------------------
          # 2. Python embeddable をダウンロードして展開
          # ---------------------------------------------------------------
          $pyver = "3.11.9"
          $url   = "https://www.python.org/ftp/python/$pyver/python-$pyver-embed-amd64.zip"
          Invoke-WebRequest $url -OutFile python_embed.zip
          Expand-Archive python_embed.zip -DestinationPath $dist -Force

          # ---------------------------------------------------------------
          # 3. ._pth に site-packages パスを追加してインポートできるようにする
          # ---------------------------------------------------------------
          $pth = Get-ChildItem $dist -Filter "python311._pth" | Select-Object -First 1
          $lines = Get-Content $pth.FullName
          $lines = $lines -replace '#import site', 'import site'
          $lines += "Lib\site-packages"
          Set-Content $pth.FullName ($lines -join "`n")

          # ---------------------------------------------------------------
          # 4. tkinter サポートファイルを Python インストール先からコピー
          # ---------------------------------------------------------------
          $pyDir  = Split-Path (Get-Command python).Path
          $dlls   = "$pyDir\DLLs"
          foreach ($f in @("_tkinter.pyd","tcl86t.dll","tk86t.dll","zlib1.dll")) {
            if (Test-Path "$dlls\$f") { Copy-Item "$dlls\$f" $dist }
          }
          if (Test-Path "$pyDir\tcl") {
            Copy-Item "$pyDir\tcl" "$dist\tcl" -Recurse -Force
          }
          if (Test-Path "$pyDir\Lib\tkinter") {
            Copy-Item "$pyDir\Lib\tkinter" "$pkgs\tkinter" -Recurse -Force
          }

          # ---------------------------------------------------------------
          # 5. OCR ヘルパー（.NET Framework 4.8 exe）をビルドして同梱
          # ---------------------------------------------------------------
          dotnet --version
          dotnet publish ocr_helper\ocr_helper.csproj -c Release -o "$dist\_ocr_tmp"
          Copy-Item "$dist\_ocr_tmp\ocr_helper.exe" "$dist\"
          Remove-Item "$dist\_ocr_tmp" -Recurse -Force

          # ---------------------------------------------------------------
          # 6. アプリ本体をコピー
          # ---------------------------------------------------------------
          Copy-Item aar_tool.py $dist\

          # ---------------------------------------------------------------
          # 7. アイコン生成（Pillow）→ ランチャー exe ビルド
          # ---------------------------------------------------------------
          # アイコン生成はシステム Python で実行するため別途インストール
          pip install Pillow --quiet

          # 緑のプレイボタンアイコンを Pillow で生成して launcher/ に配置
          $iconScript = @'
from PIL import Image, ImageDraw
sizes = [256, 64, 48, 32, 16]
imgs = []
for sz in sizes:
    img = Image.new("RGBA", (sz, sz), (0, 0, 0, 0))
    d = ImageDraw.Draw(img)
    p = max(1, sz // 8)
    d.rounded_rectangle([p, p, sz-p-1, sz-p-1], radius=sz//5, fill=(46, 160, 100, 255))
    m = sz // 4
    pts = [(m + sz//10, m), (m + sz//10, sz-m), (sz-m, sz//2)]
    d.polygon(pts, fill=(255, 255, 255, 230))
    imgs.append(img)
imgs[0].save(r"launcher\icon.ico", format="ICO", append_images=imgs[1:])
'@
          python -c $iconScript

          dotnet publish launcher\launcher.csproj -c Release -o "$dist\_launcher_tmp"
          Copy-Item "$dist\_launcher_tmp\PlayMemoMaker.exe" "$dist\"
          Remove-Item "$dist\_launcher_tmp" -Recurse -Force

          # ---------------------------------------------------------------
          # 8. debug.bat（コンソール付き起動 / トラブルシュート用）
          # ---------------------------------------------------------------
          $dbg = '@echo off' + "`r`n" +
                 'set TCL_LIBRARY=%~dp0tcl\tcl8.6' + "`r`n" +
                 'set TK_LIBRARY=%~dp0tcl\tk8.6' + "`r`n" +
                 'cd /d "%~dp0"' + "`r`n" +
                 '"%~dp0python.exe" "%~dp0aar_tool.py"' + "`r`n" +
                 'pause'
          Set-Content "$dist\debug.bat" $dbg -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayMemoMaker-Windows
          path: dist\PlayMemoMaker\
          retention-days: 30
