<title>Hiro — 英会話練習</title>
<style>
:root {
  --jade: #2B7A6B;
  --jade-soft: #d5ece7;
  --gold: #C08B3E;
  --gold-soft: #f5e6cc;
  --coral: #C75E42;
  --bg: #F4EFE6;
  --surface: #EAE4D9;
  --surface-raised: #FFFFFF;
  --text: #1C1A17;
  --text-secondary: #6B6560;
  --text-tertiary: #9B9590;
  --border: #DDD6CC;
  --tab-inactive: #A09890;
  --input-bg: #FFFFFF;
  --msg-user-bg: #2B7A6B;
  --msg-user-text: #FFFFFF;
  --msg-ai-bg: #FFFFFF;
  --shadow: rgba(28,26,23,0.06);
  --font-body: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-phrase: Georgia, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --jade: #3DA08E;
    --jade-soft: #1e3632;
    --gold: #D4A04E;
    --gold-soft: #3a2e1a;
    --coral: #E07A60;
    --bg: #1A1B1F;
    --surface: #242630;
    --surface-raised: #2A2C36;
    --text: #E8E4DE;
    --text-secondary: #9A958E;
    --text-tertiary: #6A655E;
    --border: #363840;
    --tab-inactive: #6A655E;
    --input-bg: #2A2C36;
    --msg-user-bg: #2B7A6B;
    --msg-user-text: #FFFFFF;
    --msg-ai-bg: #2A2C36;
    --shadow: rgba(0,0,0,0.2);
  }
}
:root[data-theme="dark"] {
  --jade: #3DA08E;
  --jade-soft: #1e3632;
  --gold: #D4A04E;
  --gold-soft: #3a2e1a;
  --coral: #E07A60;
  --bg: #1A1B1F;
  --surface: #242630;
  --surface-raised: #2A2C36;
  --text: #E8E4DE;
  --text-secondary: #9A958E;
  --text-tertiary: #6A655E;
  --border: #363840;
  --tab-inactive: #6A655E;
  --input-bg: #2A2C36;
  --msg-user-bg: #2B7A6B;
  --msg-user-text: #FFFFFF;
  --msg-ai-bg: #2A2C36;
  --shadow: rgba(0,0,0,0.2);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; }
input, textarea { font-family: inherit; font-size: inherit; }

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ─── Header ─── */
.header {
  padding: 16px 20px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}
.header-icon {
  width: 36px;
  height: 36px;
  background: var(--jade);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  flex-shrink: 0;
}
.header-text h1 {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.header-text p {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.3;
}
.header-actions { margin-left: auto; display: flex; gap: 6px; }
.header-btn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--text-secondary);
  transition: background 0.15s;
}
.header-btn:hover { background: var(--surface); }

/* ─── Tabs ─── */
.tab-bar {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--bg);
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  z-index: 10;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab-btn {
  flex: 1;
  padding: 8px 0 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  letter-spacing: 0.02em;
  color: var(--tab-inactive);
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn .tab-icon { font-size: 20px; line-height: 1; }
.tab-btn.active { color: var(--jade); }
.tab-btn.active .tab-icon { transform: scale(1.05); }

/* ─── Panels ─── */
.panel {
  flex: 1;
  display: none;
  flex-direction: column;
  padding-bottom: 62px;
  overflow-y: auto;
}
.panel.active { display: flex; }

/* ─── Conversation Panel ─── */
.topic-selector {
  padding: 14px 20px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.topic-selector::-webkit-scrollbar { display: none; }
.topic-chip {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  white-space: nowrap;
  background: var(--surface);
  color: var(--text-secondary);
  transition: all 0.15s;
  border: 1px solid transparent;
}
.topic-chip.active {
  background: var(--jade-soft);
  color: var(--jade);
  border-color: var(--jade);
}

.messages {
  flex: 1;
  padding: 8px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-y: auto;
}

.msg {
  max-width: 88%;
  animation: msgIn 0.25s ease-out;
}
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-user {
  align-self: flex-end;
  background: var(--msg-user-bg);
  color: var(--msg-user-text);
  padding: 10px 14px;
  border-radius: 16px 16px 4px 16px;
  font-size: 14px;
  line-height: 1.5;
}
.msg-ai {
  align-self: flex-start;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.msg-ai-bubble {
  background: var(--msg-ai-bg);
  border-radius: 16px 16px 16px 4px;
  padding: 14px 16px;
  box-shadow: 0 1px 3px var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg-ai-q {
  font-family: var(--font-phrase);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
}
.msg-affirm {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  padding: 8px 10px;
  background: var(--gold-soft);
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text);
}
.msg-affirm-icon {
  flex-shrink: 0;
  width: 20px;
  height: 20px;
  background: var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #fff;
  margin-top: 1px;
}
.msg-natural {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.msg-natural-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}
.msg-phrase-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
}
.msg-phrase-text {
  font-family: var(--font-phrase);
  font-size: 15px;
  color: var(--jade);
  font-weight: 500;
}
.msg-phrase-note {
  font-size: 12px;
  color: var(--text-secondary);
}
.msg-point {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  padding-left: 2px;
}
.msg-correction {
  padding: 8px 10px;
  background: var(--surface);
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
}
.msg-correction-orig {
  color: var(--coral);
  text-decoration: line-through;
  text-decoration-color: var(--coral);
}
.msg-correction-fix {
  color: var(--jade);
  font-weight: 500;
}
.msg-correction-note {
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: 2px;
}

.msg-save-row {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 2px;
}
.msg-save-btn {
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 14px;
  background: var(--surface);
  color: var(--text-secondary);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
}
.msg-save-btn:hover { background: var(--gold-soft); color: var(--gold); }
.msg-save-btn.saved {
  background: var(--gold-soft);
  color: var(--gold);
  pointer-events: none;
}

.msg-followup {
  font-family: var(--font-phrase);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  padding-top: 4px;
  border-top: 1px solid var(--border);
}

/* ─── Input area ─── */
.input-area {
  padding: 10px 16px 12px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 62px;
}
.input-row {
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.input-field {
  flex: 1;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 10px 16px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.4;
  min-height: 42px;
  max-height: 120px;
  outline: none;
  transition: border-color 0.15s;
}
.input-field::placeholder { color: var(--text-tertiary); }
.input-field:focus { border-color: var(--jade); }
.send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--jade);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  transition: opacity 0.15s, transform 0.1s;
}
.send-btn:disabled { opacity: 0.4; }
.send-btn:active:not(:disabled) { transform: scale(0.92); }
.input-hint {
  font-size: 11px;
  color: var(--text-tertiary);
  text-align: center;
  margin-top: 6px;
}

/* ─── Welcome ─── */
.welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  text-align: center;
  gap: 16px;
}
.welcome-icon {
  font-size: 48px;
  margin-bottom: 4px;
}
.welcome h2 {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
}
.welcome p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
  max-width: 300px;
}
.welcome-start {
  margin-top: 8px;
  padding: 12px 28px;
  background: var(--jade);
  color: #fff;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 500;
  transition: opacity 0.15s;
}
.welcome-start:hover { opacity: 0.9; }

/* ─── Notebook Panel ─── */
.notebook-header {
  padding: 20px 20px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.notebook-header h2 {
  font-size: 18px;
  font-weight: 600;
}
.notebook-count {
  font-size: 13px;
  color: var(--text-tertiary);
  background: var(--surface);
  padding: 2px 10px;
  border-radius: 10px;
}
.notebook-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  text-align: center;
  gap: 12px;
  color: var(--text-secondary);
}
.notebook-empty-icon { font-size: 40px; opacity: 0.5; }
.notebook-empty p { font-size: 14px; line-height: 1.5; }
.notebook-list {
  padding: 4px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.phrase-card {
  background: var(--surface-raised);
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 1px 3px var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 6px;
  animation: msgIn 0.2s ease-out;
}
.phrase-card-en {
  font-family: var(--font-phrase);
  font-size: 16px;
  color: var(--jade);
  line-height: 1.4;
}
.phrase-card-note {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.4;
}
.phrase-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.phrase-action {
  font-size: 12px;
  padding: 4px 12px;
  border-radius: 12px;
  background: var(--surface);
  color: var(--text-secondary);
  transition: all 0.15s;
}
.phrase-action:hover { background: var(--jade-soft); color: var(--jade); }
.phrase-action.delete:hover { background: #f5ddd8; color: var(--coral); }
.phrase-examples {
  margin-top: 6px;
  padding: 10px 12px;
  background: var(--surface);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.phrase-examples p {
  font-family: var(--font-phrase);
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
}
.phrase-examples p::before { content: "・"; color: var(--text-tertiary); }

/* ─── Review Panel ─── */
.review-empty {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 32px;
  text-align: center;
  gap: 12px;
  color: var(--text-secondary);
}
.review-empty-icon { font-size: 40px; opacity: 0.5; }
.review-empty p { font-size: 14px; line-height: 1.5; }
.review-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 20px;
}
.review-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}
.review-bar {
  flex: 1;
  height: 4px;
  background: var(--surface);
  border-radius: 2px;
  overflow: hidden;
}
.review-bar-fill {
  height: 100%;
  background: var(--jade);
  border-radius: 2px;
  transition: width 0.3s ease;
}
.review-card {
  background: var(--surface-raised);
  border-radius: 16px;
  padding: 24px 20px;
  box-shadow: 0 2px 8px var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
}
.review-card-phrase {
  font-family: var(--font-phrase);
  font-size: 22px;
  color: var(--jade);
  line-height: 1.4;
}
.review-card-note {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
}
.review-examples {
  width: 100%;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.review-examples-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
}
.review-examples p {
  font-family: var(--font-phrase);
  font-size: 14px;
  color: var(--text);
  line-height: 1.5;
  padding-left: 2px;
}
.review-examples p::before { content: "・"; color: var(--text-tertiary); }
.review-practice {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.review-practice-label {
  font-size: 13px;
  color: var(--text-secondary);
  text-align: center;
}
.review-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 16px;
  background: var(--input-bg);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font-phrase);
  outline: none;
  text-align: center;
  transition: border-color 0.15s;
}
.review-input:focus { border-color: var(--jade); }
.review-check-btn {
  padding: 10px 24px;
  background: var(--jade);
  color: #fff;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  align-self: center;
  transition: opacity 0.15s;
}
.review-check-btn:hover { opacity: 0.9; }
.review-feedback {
  padding: 12px 16px;
  border-radius: 12px;
  font-size: 13px;
  line-height: 1.6;
  animation: msgIn 0.2s ease-out;
}
.review-feedback.good {
  background: var(--jade-soft);
  color: var(--jade);
}
.review-feedback.try-again {
  background: var(--gold-soft);
  color: var(--text);
}
.review-nav {
  display: flex;
  gap: 12px;
  justify-content: center;
}
.review-nav-btn {
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  background: var(--surface);
  color: var(--text-secondary);
  transition: all 0.15s;
}
.review-nav-btn:hover { background: var(--jade-soft); color: var(--jade); }
.review-nav-btn.primary {
  background: var(--jade);
  color: #fff;
}
.review-complete {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  text-align: center;
  gap: 16px;
  animation: msgIn 0.3s ease-out;
}
.review-complete-icon { font-size: 48px; }
.review-complete h3 { font-size: 20px; font-weight: 600; }
.review-complete p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }
.review-restart-btn {
  padding: 12px 28px;
  background: var(--jade);
  color: #fff;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 500;
}

/* ─── Topic modal ─── */
.topic-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  display: none;
  align-items: flex-end;
  justify-content: center;
}
.topic-modal-overlay.open { display: flex; }
.topic-modal {
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 20px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
  animation: slideUp 0.25s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.topic-modal h3 {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
}
.topic-modal p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.topic-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.topic-card {
  padding: 14px;
  background: var(--surface-raised);
  border-radius: 14px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all 0.15s;
}
.topic-card:hover {
  border-color: var(--jade);
  background: var(--jade-soft);
}
.topic-card-icon { font-size: 24px; }
.topic-card-name { font-size: 14px; font-weight: 500; }
.topic-card-desc { font-size: 11px; color: var(--text-secondary); }

/* ─── Toast ─── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 200;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>

<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-icon">H</div>
    <div class="header-text">
      <h1>英会話練習</h1>
      <p>フレーズの引き出しを増やそう</p>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="newTopicBtn" title="トピックを変える">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="12" y1="7" x2="12" y2="13"/></svg>
      </button>
    </div>
  </div>

  <!-- Conversation Panel -->
  <div class="panel active" id="panelConversation">
    <div class="welcome" id="welcomeScreen">

// ─── Error Detection ───
function detectErrors(text) {
  const errors = [];
  const t = text.trim();
  if (!t || t.length < 3) return errors;

  const rules = [
    {
      regex: /\b(ate|had|bought|got|made|want|need|have|saw|found|like|read|watched|played|took|drank|ordered)\s+(hamburger|sandwich|pizza|salad|coffee|beer|tea|cake|cookie|movie|book|game|meeting|party|concert|restaurant|cafe|park|museum|train|bus|car|bike|phone|computer|house|apartment|hotel|class|lesson|course|job|shower|bath|nap|walk|break|day off)\b/i,
      fix: (m) => {
        const article = /^[aeiou]/i.test(m[2]) ? 'an' : 'a';
        return { orig: m[0], fixed: `${m[1]} ${article} ${m[2]}`, note: `「${m[2]}」の前に冠詞「${article}」が必要` };
      }
    },
    {
      regex: /\b(want|need|try|tried|like|plan|planned|hope|hoped|decide|decided|forget|forgot|promise|promised)\s+(go|eat|drink|buy|see|do|make|get|have|be|take|come|give|tell|say|find|know|think|help|play|work|study|learn|read|write|watch|listen|sleep|run|walk|cook|drive|travel|visit|meet|call|send|start|stop|finish|move|stay|leave)\b/i,
      check: (m, full) => !new RegExp(`\\b${m[1]}\\s+to\\s+${m[2]}\\b`, 'i').test(full),
      fix: (m) => ({ orig: m[0], fixed: `${m[1]} to ${m[2]}`, note: `「${m[1]}」の後には「to」が必要` })
    },
    {
      regex: /\b(can't|cannot|couldn't|won't|wouldn't|shouldn't|mustn't|might not|will|would|should|must|can|could|may|might)\s+(went|ate|drank|bought|got|made|took|came|gave|told|said|found|knew|thought|saw|ran|wrote|drove|flew|spoke|slept|woke|broke|chose|forgot|lost|spent|taught|understood|wore|sat|stood|fell|held|met|paid|read|sold|sent|set|shut|kept|left|led|meant|put|showed)\b/i,
      fix: (m) => {
        const baseMap = {went:'go',ate:'eat',drank:'drink',bought:'buy',got:'get',made:'make',took:'take',came:'come',gave:'give',told:'tell',said:'say',found:'find',knew:'know',thought:'think',saw:'see',ran:'run',wrote:'write',drove:'drive',flew:'fly',spoke:'speak',slept:'sleep',woke:'wake',broke:'break',chose:'choose',forgot:'forget',lost:'lose',spent:'spend',taught:'teach',understood:'understand',wore:'wear',sat:'sit',stood:'stand',fell:'fall',held:'hold',met:'meet',paid:'pay',read:'read',sold:'sell',sent:'send',set:'set',shut:'shut',kept:'keep',left:'leave',led:'lead',meant:'mean',put:'put',showed:'show'};
        const base = baseMap[m[2].toLowerCase()] || m[2];
        return { orig: m[0], fixed: `${m[1]} ${base}`, note: '助動詞の後は原形を使います' };
      }
    },
    {
      regex: /\bI\s+(thinking|going|doing|eating|working|studying|playing|watching|reading|running|cooking|learning|waiting|trying|looking|living|coming|making|having|getting|sitting|standing|walking|talking|sleeping)\b/i,
      check: (m, full) => !new RegExp(`\\bI\\s+(am|was|'m)\\s+${m[1]}\\b`, 'i').test(full),
      fix: (m) => ({ orig: `I ${m[1]}`, fixed: `I'm ${m[1]}`, note: '進行形にはbe動詞（am/is/are）が必要' })
    },
    {
      regex: /\bthere is no many\b/i,
      fix: () => ({ orig: 'there is no many', fixed: 'there are not many', note: '「多くない」→ there are not many' })
    },
    {
      regex: /\bto there\b/i,
      fix: () => ({ orig: 'to there', fixed: 'to that', note: '「there」と「that」の使い分けに注意' })
    },
    {
      regex: /\b(the|a|my|our|their|this|that)\s+staffs?\b/i,
      check: (m, full) => /staff/i.test(full) && !/stuff/i.test(full),
      fix: (m) => {
        if (/スタッフ|従業員|社員/.test('') === false) {
          return null;
        }
        return null;
      }
    },
    {
      regex: /\byesterday I\s+(go|eat|drink|buy|make|take|come|give|tell|say|find|know|think|see|run|write|drive|fly|speak|sleep|meet|have|do|get)\b/i,
      fix: (m) => {
        const pastMap = {go:'went',eat:'ate',drink:'drank',buy:'bought',make:'made',take:'took',come:'came',give:'gave',tell:'told',say:'said',find:'found',know:'knew',think:'thought',see:'saw',run:'ran',write:'wrote',drive:'drove',fly:'flew',speak:'spoke',sleep:'slept',meet:'met',have:'had',do:'did',get:'got'};
        const past = pastMap[m[1].toLowerCase()] || m[1];
        return { orig: m[0], fixed: `yesterday I ${past}`, note: '「yesterday」があるので過去形を使います' };
      }
    },
    {
      regex: /\b(last week|last month|last year|last night|last time)\s+I\s+(go|eat|drink|buy|make|take|come|have|do|get|see|meet)\b/i,
      fix: (m) => {
        const pastMap = {go:'went',eat:'ate',drink:'drank',buy:'bought',make:'made',take:'took',come:'came',have:'had',do:'did',get:'got',see:'saw',meet:'met'};
        const past = pastMap[m[2].toLowerCase()] || m[2];
        return { orig: m[0], fixed: `${m[1]} I ${past}`, note: `「${m[1]}」は過去なので動詞も過去形に` };
      }
    }
  ];

  for (const rule of rules) {
    const m = t.match(rule.regex);
    if (m) {
      if (rule.check && !rule.check(m, t)) continue;
      const result = rule.fix(m);
      if (result) errors.push(result);
    }
  }
  return errors;
}

  convIndex: 0,
  messages: [],
  phrases: [],
  reviewIndex: 0,

};

function loadState() {
  try {
    const saved = localStorage.getItem('hiro_state');
    if (saved) {
      const s = JSON.parse(saved);
      state.phrases = s.phrases || [];
    }
  } catch(e) {}
}
function saveState() {
  try {
    localStorage.setItem('hiro_state', JSON.stringify({ phrases: state.phrases }));
  } catch(e) {}
}
loadState();

// ─── Tab switching ───
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    state.tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    const panelMap = { conversation: 'panelConversation', notebook: 'panelNotebook', review: 'panelReview' };
    $(panelMap[state.tab]).classList.add('active');
    if (state.tab === 'notebook') renderNotebook();
    if (state.tab === 'review') renderReview();
  });
});

// ─── Topic Modal ───
function openTopicModal() {
  const grid = $('topicGrid');
  grid.innerHTML = TOPICS.map(t => `
    <button class="topic-card" data-topic="${t.id}">
      <span class="topic-card-icon">${t.icon}</span>
      <span class="topic-card-name">${t.name}</span>
      <span class="topic-card-desc">${t.desc}</span>
    </button>
  `).join('');
  grid.querySelectorAll('.topic-card').forEach(card => {
    card.addEventListener('click', () => {
      selectTopic(card.dataset.topic);
      $('topicModal').classList.remove('open');
    });
  });
  $('topicModal').classList.add('open');
}

$('topicModal').addEventListener('click', (e) => {
  if (e.target === $('topicModal')) $('topicModal').classList.remove('open');
});

$('startBtn').addEventListener('click', openTopicModal);
$('newTopicBtn').addEventListener('click', openTopicModal);

function selectTopic(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  if (!topic) return;
  state.topic = topic;
  state.convIndex = 0;
  state.messages = [];
  state.started = true;

  $('welcomeScreen').style.display = 'none';
  const convArea = $('conversationArea');
  convArea.style.display = 'flex';
  messagesEl.innerHTML = '';

  addAIQuestion(topic.conversations[0].q);
  inputEl.focus();
}

// ─── Messages ───
function addAIQuestion(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-ai';
  div.innerHTML = `<div class="msg-ai-bubble"><div class="msg-ai-q">${text}</div></div>`;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg msg-user';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollToBottom();
}

function addAIResponse(userText, conv) {
  const errors = detectErrors(userText);
  const div = document.createElement('div');
  div.className = 'msg msg-ai';

  let affirmText = '';
  if (/[ぁ-んァ-ヴー一-龠]/.test(userText)) {
    affirmText = '意味は伝わりました！英語にすると…';
  } else if (errors.length > 0) {
    affirmText = '伝わりました！少しだけ直すともっと自然になりますよ。';
  } else {
    const affirmOptions = [
      'いいですね！伝わりました！',
      'バッチリ伝わりました！',
      'いい感じです！',
      '上手に言えていますよ！'
    ];
    affirmText = affirmOptions[Math.floor(Math.random() * affirmOptions.length)];
  }

  let correctionsHTML = '';
  if (errors.length > 0) {
    correctionsHTML = errors.map(e => `
      <div class="msg-correction">
        <span class="msg-correction-orig">${e.orig}</span> → <span class="msg-correction-fix">${e.fixed}</span>
        <div class="msg-correction-note">${e.note}</div>
      </div>
    `).join('');
  }

  const phrasesHTML = conv.phrases.map((p, i) => {
    const saved = state.phrases.some(sp => sp.en === p.en);
    return `
      <div class="msg-phrase-item">
        <div>
          <div class="msg-phrase-text">${p.en}</div>
          <div class="msg-phrase-note">${p.note}</div>
        </div>
      </div>
    `;
  }).join('');

  const saveButtons = conv.phrases.map((p, i) => {
    const saved = state.phrases.some(sp => sp.en === p.en);
    return `<button class="msg-save-btn ${saved ? 'saved' : ''}" data-phrase-idx="${i}">${saved ? '✓ 保存済み' : '💾 保存'}</button>`;
  }).join('');

  div.innerHTML = `
    <div class="msg-ai-bubble">
      <div class="msg-affirm">
        <span class="msg-affirm-icon">✓</span>
        <span>${affirmText}</span>
      </div>
      ${correctionsHTML}
      <div class="msg-natural">
        <div class="msg-natural-label">自然な言い方</div>
        ${phrasesHTML}
      </div>
      <div class="msg-point">💡 ${conv.point}</div>
      <div class="msg-save-row">${saveButtons}</div>
      <div class="msg-followup">${conv.followUp}</div>
    </div>
  `;

  div.querySelectorAll('.msg-save-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.phraseIdx);
      const phrase = conv.phrases[idx];
      if (!state.phrases.some(p => p.en === phrase.en)) {
        state.phrases.push({ en: phrase.en, note: phrase.note, savedAt: Date.now() });
        saveState();
        btn.classList.add('saved');
        btn.textContent = '✓ 保存済み';
        showToast('表現をメモ帳に保存しました');
      }
    });
  });

  messagesEl.appendChild(div);
  scrollToBottom();
}

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  });
}

// ─── Input handling ───
inputEl.addEventListener('input', () => {
  sendBtn.disabled = !inputEl.value.trim();
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

sendBtn.addEventListener('click', handleSend);

function handleSend() {
  const text = inputEl.value.trim();
  if (!text || !state.topic) return;

  addUserMessage(text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  const conv = state.topic.conversations[state.convIndex];

  setTimeout(() => {
    addAIResponse(text, conv);

    state.convIndex++;
    if (state.convIndex >= state.topic.conversations.length) {
      state.convIndex = 0;
      const otherTopics = TOPICS.filter(t => t.id !== state.topic.id);
      const next = otherTopics[Math.floor(Math.random() * otherTopics.length)];
      state.topic = next;
    }
  }, 400 + Math.random() * 300);
}

// ─── Notebook ───
function renderNotebook() {
  const panel = $('panelNotebook');
  if (state.phrases.length === 0) {
    panel.innerHTML = `
      <div class="notebook-empty">
        <div class="notebook-empty-icon">📖</div>
        <p>まだ表現が保存されていません。<br>会話練習で気になった表現を<br>保存してみましょう。</p>
      </div>
    `;
    return;
  }

  panel.innerHTML = `
    <div class="notebook-header">
      <h2>表現メモ帳</h2>
      <span class="notebook-count">${state.phrases.length}個</span>
    </div>
    <div class="notebook-list" id="notebookList"></div>
  `;

  const list = $('notebookList');
  state.phrases.forEach((phrase, i) => {
    const card = document.createElement('div');
    card.className = 'phrase-card';
    card.innerHTML = `
      <div class="phrase-card-en">${phrase.en}</div>
      <div class="phrase-card-note">${phrase.note}</div>
      <div class="phrase-card-actions">
        <button class="phrase-action example-btn" data-idx="${i}">例文を見る</button>
        <button class="phrase-action delete" data-idx="${i}">削除</button>
      </div>
    `;

    card.querySelector('.example-btn').addEventListener('click', function() {
      const existing = card.querySelector('.phrase-examples');
      if (existing) { existing.remove(); return; }
      const examples = generateExamples(phrase.en);
      const exDiv = document.createElement('div');
      exDiv.className = 'phrase-examples';
      exDiv.innerHTML = examples.map(e => `<p>${e}</p>`).join('');
      card.appendChild(exDiv);
    });

    card.querySelector('.delete').addEventListener('click', () => {
      state.phrases.splice(i, 1);
      saveState();
      renderNotebook();
      showToast('表現を削除しました');
    });

    list.appendChild(card);
  });
}

// ─── Review ───
function renderReview() {
  const panel = $('panelReview');
  if (state.phrases.length === 0) {
    panel.innerHTML = `
      <div class="review-empty">
        <div class="review-empty-icon">🔄</div>
        <p>復習する表現がありません。<br>まず会話練習で表現を<br>保存しましょう。</p>
      </div>
    `;
    return;
  }

  if (state.reviewDone) {
    panel.innerHTML = `
      <div class="review-complete">
        <div class="review-complete-icon">🎉</div>
        <h3>復習完了！</h3>
        <p>${state.phrases.length}個の表現を復習しました。<br>この調子で引き出しを増やしていきましょう！</p>
        <button class="review-restart-btn" id="reviewRestart">もう一度復習する</button>
      </div>
    `;
    $('reviewRestart').addEventListener('click', () => {
      state.reviewIndex = 0;
      state.reviewDone = false;
      renderReview();
    });
    return;
  }

  if (state.reviewIndex >= state.phrases.length) {
    state.reviewIndex = 0;
  }

  const phrase = state.phrases[state.reviewIndex];
  const examples = generateExamples(phrase.en);
  const progress = ((state.reviewIndex + 1) / state.phrases.length * 100);

  panel.innerHTML = `
    <div class="review-container">
      <div class="review-progress">
        <span>${state.reviewIndex + 1} / ${state.phrases.length}</span>
        <div class="review-bar"><div class="review-bar-fill" style="width:${progress}%"></div></div>
      </div>
      <div class="review-card">
        <div class="review-card-phrase">${phrase.en}</div>
        <div class="review-card-note">${phrase.note}</div>
        <div class="review-examples">
          <div class="review-examples-label">例文</div>
          ${examples.map(e => `<p>${e}</p>`).join('')}
        </div>
      </div>
      <div class="review-practice">
        <div class="review-practice-label">この表現を使って自分の文を作ってみよう</div>
        <input type="text" class="review-input" id="reviewInput" placeholder="英語で文を入力...">
        <button class="review-check-btn" id="reviewCheck">チェック</button>
        <div id="reviewFeedback"></div>
      </div>
      <div class="review-nav">
        <button class="review-nav-btn" id="reviewSkip">スキップ</button>
        <button class="review-nav-btn primary" id="reviewNext" style="display:none">次へ</button>
      </div>
    </div>
  `;

  $('reviewCheck').addEventListener('click', () => {
    const input = $('reviewInput').value.trim();
    if (!input) return;

    const fb = $('reviewFeedback');
    const keyWords = phrase.en.toLowerCase().split(/\s+/).filter(w => w.length > 3 && !['this','that','with','from','have','been','just','some','your','what','when','where','very','really','about','would','could','should','there','their','more','than','also','into','most','over','only'].includes(w));
    const inputLower = input.toLowerCase();
    const hasKeyword = keyWords.some(w => inputLower.includes(w));

    const errors = detectErrors(input);

    if (hasKeyword && errors.length === 0) {
      fb.innerHTML = `<div class="review-feedback good">いい文ですね！「${phrase.en.split(' ').slice(0, 4).join(' ')}...」のパターンをうまく使えています。</div>`;
    } else if (hasKeyword && errors.length > 0) {
      fb.innerHTML = `<div class="review-feedback try-again">パターンは合っています！少し修正：<br>${errors.map(e => `<span style="color:var(--coral);text-decoration:line-through">${e.orig}</span> → <span style="color:var(--jade);font-weight:500">${e.fixed}</span><br><span style="font-size:12px;color:var(--text-secondary)">${e.note}</span>`).join('<br>')}</div>`;
    } else {
      fb.innerHTML = `<div class="review-feedback try-again">「${keyWords[0] || phrase.en.split(' ')[1]}」を使ってみましょう。<br>例：${examples[0]}</div>`;
    }

    $('reviewNext').style.display = '';
  });

  $('reviewInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('reviewCheck').click();
  });

  function goNext() {
    state.reviewIndex++;
    if (state.reviewIndex >= state.phrases.length) {
      state.reviewDone = true;
    }
    renderReview();
  }

  $('reviewSkip').addEventListener('click', goNext);
  $('reviewNext').addEventListener('click', goNext);
}

// ─── Init ───
if (state.started) {
  $('welcomeScreen').style.display = 'none';
  $('conversationArea').style.display = 'flex';
}
</script>
